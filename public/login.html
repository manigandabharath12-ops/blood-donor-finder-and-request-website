<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Donor Login | Blood Donor Finder</title><link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" defer></script><script src="js/login.js" defer></script>
</head>
<body><header id="site-header"></header>
<main class="page-main container">
  <div class="form-shell narrow-shell">
    <div class="section-heading"><span class="eyebrow">Welcome back</span><h1>Donor login</h1><p>Log in to manage your donor profile and availability.</p></div>
    <div id="form-message" class="message" role="status" aria-live="polite"></div>
    <form id="login-form" class="form-grid single-column" novalidate>
      <label>Email address<input name="email" type="email" autocomplete="email" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="button button-primary" type="submit">Log in</button>
      <p>New to the community? <a href="register.html">Register as a donor</a></p>
    </form>
  </div>
</main><footer id="site-footer"></footer></body></html>
